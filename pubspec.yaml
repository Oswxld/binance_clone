name: binance
description: Binance-inspired Flutter demo home screen with a Supabase-backed KES balance.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  fl_chart: ^1.3.0
  qr_flutter: ^4.1.0
  http: ^1.6.0
  supabase_flutter: ^2.18.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/svgs/
    - assets/svgs/home_icons/
    - assets/svgs/invest_icons/
    - assets/svgs/market_icons/
